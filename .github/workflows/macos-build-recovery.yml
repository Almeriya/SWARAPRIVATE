name: macOS 1.3.1 native build recovery diagnostics
# This is never a full release-qualification gate or audio-reference approval.
on:
  push:
    branches: [engineering/macos-131-qualification-recovery]
    paths: [.github/workflows/macos-build-recovery.yml]
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac runner
        type: choice
        required: true
        default: x86_64
        options: [x86_64, arm64]
      profile:
        description: Instrumented build and entire registered CTest inventory
        type: choice
        required: true
        default: Release
        options: [Release, Debug, asan-ubsan, tsan]
permissions:
  contents: read
concurrency:
  group: sw2-build-recovery-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-build-probe:
    name: UNQUALIFIED build probe (${{ matrix.architecture }}, ${{ matrix.profile }})
    if: github.repository == 'Almeriya/SWARAPRIVATE'
    strategy:
      # Exact missing timeout profiles. Only one expensive Mac runner at a time.
      # Cancel pending profiles on a failure; diagnose before another expensive run.
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - {architecture: arm64, profile: asan-ubsan, runner: macos-15}
          - {architecture: x86_64, profile: asan-ubsan, runner: macos-15-intel}
          - {architecture: x86_64, profile: tsan, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      TARGET_ARCH: ${{ matrix.architecture }}
      TARGET_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public source and pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Almeriya/SWARAPRIVATE
          test "$SWARAXT_REPOSITORY_PRIVATE" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Measure native compilation and full CTest without reference approval
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/build_recovery_probe.py
          --root "$RUNNER_TEMP/swara-build-recovery"
          --arch "$TARGET_ARCH"
          --profile "$TARGET_PROFILE"
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-build-recovery-${{ matrix.architecture }}-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swara-build-recovery/*.log
            ${{ runner.temp }}/swara-build-recovery/*.json
            ${{ runner.temp }}/swara-build-recovery/*.xml
            ${{ runner.temp }}/swara-build-recovery/build/Testing/Temporary/LastTest.log*
          if-no-files-found: warn
          retention-days: 7
