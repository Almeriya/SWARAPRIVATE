name: macOS 1.3.1 native build recovery diagnostics
# This is never a full release-qualification gate or audio-reference approval.
# workflow_dispatch on this branch runs a single registered CTest target probe
# (Stage A recovery). Push on the historical recovery branch keeps the matrix.
on:
  push:
    branches: [engineering/macos-131-qualification-recovery]
    paths: [.github/workflows/macos-build-recovery.yml]
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac runner
        type: choice
        required: true
        default: arm64
        options: [x86_64, arm64]
      profile:
        description: Native profile for the probe (targeted) or full inventory
        type: choice
        required: true
        default: Debug
        options: [Release, Debug, asan-ubsan, tsan]
      suite:
        description: restore-completion variants, Classic PCM capture that never admits goldens, or uninstrumented audio parity
        type: choice
        required: true
        default: restore-completion
        options: [restore-completion, classic-pcm, audio-parity]
permissions:
  contents: read
concurrency:
  group: sw2-build-recovery-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}-${{ inputs.architecture || 'matrix' }}-${{ inputs.profile || 'matrix' }}-${{ inputs.suite || 'matrix' }}
  cancel-in-progress: false
jobs:
  targeted-native-test:
    name: targeted native test (${{ inputs.architecture }}, ${{ inputs.profile }}, ${{ matrix.target }})
    if: github.repository == 'Almeriya/SWARAPRIVATE' && github.event_name == 'workflow_dispatch' && inputs.suite == 'restore-completion'
    strategy:
      # Restore-completion overlay verification: every registered CTest variant
      # for the two executables, including fault-injection names. Not audio approval.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {target: SwaraXTRestoreCompletionTests, regex: '^SwaraXTRestoreCompletion'}
          - {target: SwaraXTHostStateSafetyTests, regex: '^(SwaraXTHostStateSafetyTests|SwaraXTHostRestoreFault-)'}
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      TARGET_ARCH: ${{ inputs.architecture }}
      TARGET_PROFILE: ${{ inputs.profile }}
      PROBE_TARGET: ${{ matrix.target }}
      PROBE_REGEX: ${{ matrix.regex }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public source and pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Almeriya/SWARAPRIVATE
          test "$SWARAXT_REPOSITORY_PRIVATE" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Compile and run one registered CTest target
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/native_test_probe.py
          --root "$RUNNER_TEMP/swara-native-test-probe"
          --arch "$TARGET_ARCH"
          --profile "$TARGET_PROFILE"
          --target "$PROBE_TARGET"
          --ctest-regex "$PROBE_REGEX"
          --source-sha "$GITHUB_SHA"
      - name: Preserve probe evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-native-test-probe-${{ inputs.architecture }}-${{ inputs.profile }}-${{ env.PROBE_TARGET }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swara-native-test-probe/*.log
            ${{ runner.temp }}/swara-native-test-probe/*.json
            ${{ runner.temp }}/swara-native-test-probe/*.xml
            ${{ runner.temp }}/swara-native-test-probe/build/Testing/Temporary/LastTest.log*
          if-no-files-found: warn
          retention-days: 7

  classic-pcm-capture:
    name: classic pcm capture (${{ inputs.architecture }}, ${{ inputs.profile }})
    if: github.repository == 'Almeriya/SWARAPRIVATE' && github.event_name == 'workflow_dispatch' && inputs.suite == 'classic-pcm'
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      TARGET_ARCH: ${{ inputs.architecture }}
      TARGET_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public source and pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Almeriya/SWARAPRIVATE
          test "$SWARAXT_REPOSITORY_PRIVATE" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Compile AudioParityTests and write Classic float32 captures
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/native_test_probe.py
          --root "$RUNNER_TEMP/swara-native-test-probe"
          --arch "$TARGET_ARCH"
          --profile "$TARGET_PROFILE"
          --target SwaraXTAudioParityTests
          --classic-pcm-capture
          --source-sha "$GITHUB_SHA"
      - name: Preserve Classic PCM evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-classic-pcm-${{ inputs.architecture }}-${{ inputs.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swara-native-test-probe/*.log
            ${{ runner.temp }}/swara-native-test-probe/*.json
            ${{ runner.temp }}/swara-native-test-probe/*.xml
            ${{ runner.temp }}/swara-native-test-probe/classic-pcm/**
            ${{ runner.temp }}/swara-native-test-probe/build/Testing/Temporary/LastTest.log*
          if-no-files-found: warn
          retention-days: 7

  audio-parity:
    name: audio parity (${{ inputs.architecture }}, ${{ inputs.profile }})
    if: github.repository == 'Almeriya/SWARAPRIVATE' && github.event_name == 'workflow_dispatch' && inputs.suite == 'audio-parity'
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      TARGET_ARCH: ${{ inputs.architecture }}
      TARGET_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public source and pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Almeriya/SWARAPRIVATE
          test "$SWARAXT_REPOSITORY_PRIVATE" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Compile and run uninstrumented SwaraXTAudioParityTests
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/native_test_probe.py
          --root "$RUNNER_TEMP/swara-native-test-probe"
          --arch "$TARGET_ARCH"
          --profile "$TARGET_PROFILE"
          --target SwaraXTAudioParityTests
          --source-sha "$GITHUB_SHA"
      - name: Preserve audio-parity evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-audio-parity-${{ inputs.architecture }}-${{ inputs.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swara-native-test-probe/*.log
            ${{ runner.temp }}/swara-native-test-probe/*.json
            ${{ runner.temp }}/swara-native-test-probe/*.xml
            ${{ runner.temp }}/swara-native-test-probe/build/Testing/Temporary/LastTest.log*
          if-no-files-found: warn
          retention-days: 7

  native-build-probe:
    name: UNQUALIFIED build probe (${{ matrix.architecture }}, ${{ matrix.profile }})
    if: github.repository == 'Almeriya/SWARAPRIVATE' && github.event_name == 'push'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - {architecture: arm64, profile: asan-ubsan, runner: macos-15}
          - {architecture: x86_64, profile: asan-ubsan, runner: macos-15-intel}
          - {architecture: x86_64, profile: tsan, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      SWARAXT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      TARGET_ARCH: ${{ matrix.architecture }}
      TARGET_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public source and pinned build frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Almeriya/SWARAPRIVATE
          test "$SWARAXT_REPOSITORY_PRIVATE" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Measure native compilation and full CTest without reference approval
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 scripts/macos/build_recovery_probe.py
          --root "$RUNNER_TEMP/swara-build-recovery"
          --arch "$TARGET_ARCH"
          --profile "$TARGET_PROFILE"
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-build-recovery-${{ matrix.architecture }}-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swara-build-recovery/*.log
            ${{ runner.temp }}/swara-build-recovery/*.json
            ${{ runner.temp }}/swara-build-recovery/*.xml
            ${{ runner.temp }}/swara-build-recovery/build/Testing/Temporary/LastTest.log*
          if-no-files-found: warn
          retention-days: 7
